
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPilot AI | The Elite Teacher Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Georgia', 'serif'],
            },
            colors: {
              premium: {
                gold: '#D4AF37',
                midnight: '#050505',
                velvet: '#0F172A',
                pearl: '#FDFDFD',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glass-shine': 'shine 2s infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shine: {
                '0%': { left: '-100%' },
                '100%': { left: '100%' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .light .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      .premium-gradient {
        background: linear-gradient(135deg, #6366F1 0%, #A855F7 50%, #EC4899 100%);
      }

      .gold-gradient {
        background: linear-gradient(135deg, #D4AF37 0%, #F59E0B 100%);
      }

      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.2);
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.5);
      }

      /* Custom animations for the Luxury feel */
      .staggered-fade-in > * {
        animation: fadeInScale 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        opacity: 0;
      }
      @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.95) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      
      .staggered-fade-in > *:nth-child(1) { animation-delay: 0.1s; }
      .staggered-fade-in > *:nth-child(2) { animation-delay: 0.2s; }
      .staggered-fade-in > *:nth-child(3) { animation-delay: 0.3s; }
      .staggered-fade-in > *:nth-child(4) { animation-delay: 0.4s; }
      .staggered-fade-in > *:nth-child(5) { animation-delay: 0.5s; }
      .staggered-fade-in > *:nth-child(6) { animation-delay: 0.6s; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-markdown": "https://aistudiocdn.com/react-markdown@^10.1.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>
  <body class="bg-[#F8FAFC] dark:bg-[#050505] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500/30">
    <div id="root"></div>
  </body>
</html>
